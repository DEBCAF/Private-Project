<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Video</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }
        .media-container {
            width: 80%;
            max-width: 900px;
            aspect-ratio: 4 / 3;
            position: relative;
            background-color: #000;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .media-container iframe,
        .media-container video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        .media-container iframe.active,
        .media-container video.active {
            display: block;
        }
        .media-container video {
            object-fit: contain;
            background-color: #000;
        }
        .episode-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            width: 80%;
            max-width: 900px;
        }
        .episode-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .episode-btn:hover:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .episode-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .episode-label {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.75);
            min-width: 8rem;
            text-align: center;
        }
        .help-text {
            margin-top: 1rem;
            max-width: 900px;
            width: 80%;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.55);
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Exclusive Content</h1>

    <div class="media-container" id="media-container">
        <!-- Google Drive episodes use iframe embeds (reliable). Direct MP4 episodes use video. -->
        <iframe id="drive-player" title="Video player" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <video id="file-player" controls controlsList="nodownload" playsinline preload="metadata"></video>
    </div>

    <div class="episode-controls">
        <button type="button" class="episode-btn" id="prev-episode">Previous Episode</button>
        <span class="episode-label" id="episode-label">Episode 1 of 3</span>
        <button type="button" class="episode-btn" id="next-episode">Next Episode</button>
    </div>

    <p class="help-text">
        Each Google Drive file must be shared as &ldquo;Anyone with the link&rdquo; (Viewer access).
    </p>

    <script>
        /*
         * Use either:
         *   fileId: 'abc123'  -> Google Drive iframe embed (recommended)
         *   src: 'videos/ep1.mp4' -> self-hosted MP4 via HTML5 video
         */
        const episodes = [
            { title: 'Episode 1', fileId: 'YOUR_FILE_ID_1' },
            { title: 'Episode 2', fileId: 'YOUR_FILE_ID_2' },
            { title: 'Episode 3', fileId: 'YOUR_FILE_ID_3' },
        ];

        const drivePlayer = document.getElementById('drive-player');
        const filePlayer = document.getElementById('file-player');
        const prevBtn = document.getElementById('prev-episode');
        const nextBtn = document.getElementById('next-episode');
        const episodeLabel = document.getElementById('episode-label');

        let currentEpisode = 0;

        function drivePreviewUrl(fileId) {
            return 'https://drive.google.com/file/d/' + fileId + '/preview';
        }

        function hideAllPlayers() {
            drivePlayer.classList.remove('active');
            filePlayer.classList.remove('active');
            drivePlayer.src = '';
            filePlayer.pause();
            filePlayer.removeAttribute('src');
            filePlayer.load();
        }

        function loadEpisode(index) {
            currentEpisode = index;
            const episode = episodes[index];

            hideAllPlayers();

            if (episode.fileId) {
                drivePlayer.src = drivePreviewUrl(episode.fileId);
                drivePlayer.classList.add('active');
            } else if (episode.src) {
                filePlayer.src = episode.src;
                filePlayer.classList.add('active');
                filePlayer.load();
            }

            episodeLabel.textContent = episode.title + ' of ' + episodes.length;
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === episodes.length - 1;
        }

        prevBtn.addEventListener('click', function () {
            if (currentEpisode > 0) {
                loadEpisode(currentEpisode - 1);
            }
        });

        nextBtn.addEventListener('click', function () {
            if (currentEpisode < episodes.length - 1) {
                loadEpisode(currentEpisode + 1);
            }
        });

        loadEpisode(0);
    </script>

</body>
</html>
